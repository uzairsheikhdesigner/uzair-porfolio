
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAVAA Coffee — Social Media Campaign</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #FFFFFF 0%, #F2F8FC 50%, #E3F1FA 100%);
            color: #0B2D5C;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 30px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d8e3ec;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .back {
            color: #7A1F5C;
            text-decoration: none;
            font-size: 13px;
        }

        main {
            padding: 70px 7%;
        }

        .label {
            color: #7A1F5C;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(45px, 7vw, 90px);
            line-height: 0.95;
            margin-bottom: 25px;
        }

        h1 span {
            color: #7A1F5C;
            font-style: italic;
        }

        .intro {
            max-width: 650px;
            color: #53677a;
            line-height: 1.7;
            margin-bottom: 60px;
        }

        .campaign-title {
            font-family: Georgia, serif;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .campaign-subtitle {
            color: #7A1F5C;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #d5e1ea;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        BRANDING BY UZAIR
    </div>

    <a href="index.html" class="back">
        ← BACK TO PORTFOLIO
    </a>

</header>

<main>

    <div class="label">
        01 / SOCIAL MEDIA CAMPAIGN
    </div>

    <h1>
        KAVAA Coffee<br>
        <span>Social Media Campaign.</span>
    </h1>

    <p class="intro">
        A lifestyle-driven social media campaign created for KAVAA Coffee,
        focusing on café atmosphere, coffee culture and modern visual storytelling.
    </p>

    <h2 class="campaign-title">
        KAVAA Coffee
    </h2>

    <div class="campaign-subtitle">
        LIFESTYLE & CAFÉ ATMOSPHERE
    </div>

    <div class="gallery">

        <img src="kavaa-coffee-social-media-campaign/social-media-campaigncoffeecoffee-01 (1).png" alt="KAVAA Coffee Campaign 1">

        <img src="kavaa-coffee-social-media-campaign/social-media-campaigncoffeecoffee-01 (2).png" alt="KAVAA Coffee Campaign 2">

        <img src="kavaa-coffee-social-media-campaign/social-media-campaigncoffeecoffee-01 (3).png" alt="KAVAA Coffee Campaign 3">

        <img src="kavaa-coffee-social-media-campaign/social-media-campaigncoffeecoffee-01 (4).png" alt="KAVAA Coffee Campaign 4">

        <img src="kavaa-coffee-social-media-campaign/social-media-campaigncoffeecoffee-01 (5).png" alt="KAVAA Coffee Campaign 5">

    </div>

</main>

</body>
</html>
