
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skincare — Branding by Uzair</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #FFFFFF 0%, #F2F8FC 50%, #E3F1FA 100%);
            color: #0B2D5C;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 30px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d8e3ec;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .back {
            color: #7A1F5C;
            text-decoration: none;
            font-size: 13px;
        }

        main {
            padding: 70px 7%;
        }

        .label {
            color: #7A1F5C;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(50px, 8vw, 100px);
            line-height: 0.95;
            margin-bottom: 20px;
            color: #0B2D5C;
        }

        h1 span {
            color: #7A1F5C;
            font-style: italic;
        }

        .subtitle {
            color: #53677a;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 55px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .gallery-item {
            background: #ffffff;
            border: 1px solid #d5e1ea;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-item:first-child {
            grid-column: span 2;
        }

        @media (max-width: 700px) {

            main {
                padding: 50px 6%;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        BRANDING BY UZAIR
    </div>

    <a href="social-media-campaign.html" class="back">
        ← BACK TO SOCIAL MEDIA CAMPAIGN
    </a>

</header>

<main>

    <div class="label">
        SOCIAL MEDIA CAMPAIGN
    </div>

    <h1>
        Skincare<br>
        <span>Campaign.</span>
    </h1>

    <p class="subtitle">
        BEAUTY & SKINCARE SOCIAL MEDIA
    </p>

    <div class="gallery">

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (1).png" alt="Skincare Campaign 1">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (2).png" alt="Skincare Campaign 2">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (3).png" alt="Skincare Campaign 3">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (4).png" alt="Skincare Campaign 4">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (5).png" alt="Skincare Campaign 5">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (6).png" alt="Skincare Campaign 6">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (7).png" alt="Skincare Campaign 7">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (8).png" alt="Skincare Campaign 8">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (9).png" alt="Skincare Campaign 9">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (10).png" alt="Skincare Campaign 10">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (11).png" alt="Skincare Campaign 11">
        </div>

        <div class="gallery-item">
            <img src="skincare-social-media-campaign/skincare-social-media-campaign (12).png" alt="Skincare Campaign 12">
        </div>

    </div>

</main>

</body>
</html>
